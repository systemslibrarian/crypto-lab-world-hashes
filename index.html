    <script>
      // Set the theme before first paint to avoid a flash. localStorage access
      // can throw in sandboxed/private contexts, so guard it and default to dark.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
